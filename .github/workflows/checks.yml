# The same gates as `make check` locally: lint, typecheck, complexity, deadcode,
# deps and test, stopping at the first failure. They run inside the image
# domino/Dockerfile builds from (Domino's Ubuntu), in a virtualenv on the Python of
# .python-version, as the Apps do when they start.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    # One place names the image: the BASE_IMAGE line of domino/Dockerfile.
    runs-on: ubuntu-22.04
    outputs:
      base: ${{ steps.dockerfile.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - id: dockerfile
        run: |
          base=$(sed -n 's/^ARG BASE_IMAGE=//p' domino/Dockerfile)
          test -n "$base" || { echo "no ARG BASE_IMAGE= line in domino/Dockerfile"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"

  check:
    needs: image
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: ${{ needs.image.outputs.base }}
      # The image's own user is ubuntu; the checkout needs root.
      options: --user root
    env:
      # ubuntu, the user Domino runs Apps as, runs every step below.
      AS_UBUNTU: runuser -u ubuntu -- env HOME=/home/ubuntu
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet uv && chown -R ubuntu .
      # A virtualenv of its own: the image's packages (an old urllib3) break locust.
      # uv reads the Python version from .python-version.
      - run: $AS_UBUNTU uv venv
      # CPU-only torch first, so sentence-transformers does not pull the CUDA wheels.
      - run: $AS_UBUNTU uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: $AS_UBUNTU uv pip install -e ".[dev]"
      # The Makefile uses the .venv in this directory.
      - run: $AS_UBUNTU make check
