# The same gates as `make check` locally: lint, typecheck, complexity, deadcode,
# deps and test, stopping at the first failure. They run inside the image
# domino/Dockerfile builds from, so CI sees the Ubuntu and Python that Domino runs.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    # One place names the image: the BASE_IMAGE line of domino/Dockerfile.
    runs-on: ubuntu-22.04
    outputs:
      base: ${{ steps.dockerfile.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - id: dockerfile
        run: |
          base=$(sed -n 's/^ARG BASE_IMAGE=//p' domino/Dockerfile)
          test -n "$base" || { echo "no ARG BASE_IMAGE= line in domino/Dockerfile"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"

  check:
    needs: image
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: ${{ needs.image.outputs.base }}
      # The image's own user is ubuntu; the checkout and pip need root.
      options: --user root
    steps:
      - uses: actions/checkout@v4
      # CPU-only torch first, so sentence-transformers does not pull the CUDA wheels.
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      # The gates run as ubuntu, the user Domino runs Apps as.
      - run: chown -R ubuntu . && runuser -u ubuntu -- env "PATH=$PATH" HOME=/home/ubuntu make check
