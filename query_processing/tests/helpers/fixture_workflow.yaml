# The toolkit's tests run on this workflow file, never on a use case's
# (conftest.py names it in QP_WORKFLOW_FILE for every test). It has the shape
# of a four-stage retrieval workflow (embed, retrieve, rerank, generate) and
# made-up models: no source id here names real weights, and no URL a real
# endpoint. A test changes a value by its path (settings_factory) or writes a
# file of its own (rag_graphs.write_workflow_file).
components:
  embedder:
    backend: local
    source_id: fixture-org/fixture-embedder
    query_prefix: "query: "
  reranker:
    backend: local
    source_id: fixture-org/fixture-reranker
  llm:
    backend: api
    api:
      url: https://llm.fixture.test/v1/chat/completions
      api_format: openai
      model: fixture-chat-model
    http:
      timeout_s: 120
  vector_store:
    backend: elasticsearch
    elasticsearch:
      url: http://localhost:9200
      index: fixture_records
    chroma:
      collection: fixture_records
    metadata_field_info:
      - name: topic
        type: string
        description: the handbook topic a passage belongs to

graph:
  stages:
    embed:
      call: embedder
      reads: [standalone_query]
      writes: [query_embedding]
    retrieve:
      call: vector_store
      retrieval_mode: dense
      top_k: 20
      reads: [query_embedding, metadata_filter]
      writes: [candidates]
    rerank:
      call: reranker
      top_k: 10
      reads: [standalone_query, candidates]
      writes: [reranked]
    generate:
      call: llm
      reads: [conversational_query, reranked]
      writes: [answer]
      prompt: answer_from_context # of fixture_prompts.yaml
  edges:
    - [START, embed, retrieve, rerank]
    - [generate, END]
  conditional_edges:
    - source: rerank
      path: is_query_mode
      reads: [mode]
      path_map: {true: generate, false: END}
