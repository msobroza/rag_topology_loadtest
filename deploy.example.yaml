# rag-deploy settings: cp deploy.example.yaml deploy.yaml, then edit (deploy.yaml is
# git-ignored). Run `make deploy` / `make status` from the repository root (for
# example /repos/<project>) in a Domino Workspace of the one project that hosts all
# the Apps: the Apps run domino/app.sh by that absolute path.
#
# Secrets do NOT go here: every `settings` value is written into an App's launch
# script. Keep every API key (RAG_COMPONENTS__VECTOR_STORE__ELASTICSEARCH__API_KEY,
# RAG_COMPONENTS__LLM__API__API_KEY,
# any bearer token for RAG_COMPONENTS__EMBEDDER__API__API_KEY or
# RAG_COMPONENTS__RERANKER__API__API_KEY) in Domino's project or user environment
# variables: rag-deploy refuses a setting ending with _API_KEY in this file
# unless it is empty or `domino`.
#
# Unknown keys are refused. A RAG_DEPLOY_<KEY> environment variable overrides a
# top-level key, e.g. `RAG_DEPLOY_TOPOLOGY=monolith make deploy`; RAG_DEPLOY_FILE
# names another file. rag-deploy also reads the workflow file the workflow App
# reads (RAG_WORKFLOW_FILE in its settings, else as rag-serve finds it), to know
# the components a topology alias names.

# The topology deployed: one of the topology aliases below.
topology: split-all
# Each topology alias says where the components it names run: local, in the
# workflow App's process, or served, by a model server App of its own (named
# <app_name_prefix>-<component>). The names are the workflow file's components.
# A component an alias does not name keeps the backend the workflow file gives
# it (here the LLM, on api). A model server serves an embedder or a reranker,
# the component named after its type; any other served component is refused
# before anything is published. A new alias is one more row: rag-deploy
# publishes one App per served component, then the workflow App, and writes each
# named component's backend and served URL into the workflow App's launch
# script, and the run label: the alias, then +<component>=<model_server> for
# each served one (split-all+embedder=fastapi+reranker=fastapi).
topology_alias:
  monolith: {embedder: local, reranker: local}
  split-reranker: {embedder: local, reranker: served}
  split-all: {embedder: served, reranker: served}
# fastapi | ovms: what serves the models in the model server Apps
model_server: fastapi
# The project hosting the Apps; "" = DOMINO_PROJECT_ID (this Workspace's project).
project_id: ""
# Each App is named <app_name_prefix>-<part> (part: workflow or a served component),
# so two use cases with two prefixes share one project. Lowercase letters and
# digits in words joined by single hyphens, starting with a letter, e.g. qp-rag:
# rag-deploy's own rule (we found none of Domino's), checked before anything is
# published. An App is found by its name, so a new prefix creates new Apps; delete
# the old ones by hand in Domino.
app_name_prefix: rag
# Required for ovms: the OVMS bundle as the Apps see it (project files or a Dataset),
# either a folder with bin/ovms and lib/ or the release .tar.gz, for example
# /domino/datasets/local/<dataset>/ovms.tar.gz
ovms_bundle: ""
# Where Apps answer: {domino_host}/{owner}/{project}/r/notebookSession/{instance id}.
# "" = the scheme and host of the App's own url.
domino_host: ""
# Rarely changed: waiting for an App, and talking to Domino.
# wait_timeout_s: 600
# poll_interval_s: 5
# no_instance_grace_s: 60   # an App with no instance after this long is reported
# http_timeout_s: 30
# http_retries: 2
# run_token_url: http://localhost:8899/access-token

# Every App, unless its own block below says otherwise. rag-deploy refuses to
# deploy while a value still holds an <angle-bracket> placeholder.
defaults:
  # Required: the Domino compute environment (its id is in the URL of the
  # environment's page in Domino). Any environment with `uv` works: the Apps
  # install their own dependencies when they start, on Python 3.11 (uv downloads
  # it when the environment has none).
  environment_id: "<environment id>"
  # Optional: holds the Apps to one build of that environment, by the id of one of
  # its revisions (sent to Domino as environmentRevisionId); "" = Domino chooses.
  # It goes only with the environment above: an App that sets its own
  # environment_id does not take it, and without environment_id it is refused.
  environment_revision_id: ""
  # The hardware tier id; "" = the project's default.
  hardware_tier_id: ""
  # Environment variables for the App, exported by its launch script. rag-deploy
  # itself sets RAG_ROLE, RAG_TOPOLOGY, RAG_COMPONENTS__<COMPONENT>__BACKEND of each
  # component the topology alias names and RAG_COMPONENTS__<COMPONENT>__SERVED__URL
  # of each served one, RAG_OVMS_BUNDLE and RAG_BOOTSTRAP (those win), and
  # RAG_RUN_LABEL unless set here. A value of the workflow file is set by the
  # variable its path names, its levels joined by __.
  settings:
    # Required: the Elasticsearch cluster every workflow App queries.
    RAG_COMPONENTS__VECTOR_STORE__ELASTICSEARCH__URL: "https://<elasticsearch host>:9200"
    # The model paths (each component's source_id) are here, not per App,
    # because which App loads a model depends on the topology (the workflow
    # loads the embedder in split-reranker and both models in monolith). A
    # Hugging Face id works as well as a folder; a model server serves it under
    # its alias, the folder's last part, as the workflow App calls it.
    RAG_COMPONENTS__EMBEDDER__SOURCE_ID: /domino/datasets/local/<dataset>/models/snowflake-arctic-embed-l-v2.0
    RAG_COMPONENTS__RERANKER__SOURCE_ID: /domino/datasets/local/<dataset>/models/crossencoder-camembert-base-mmarcoFR
    # Where rag-export-openvino wrote the in-process models (a model without a
    # folder there is converted in memory at every start):
    # RAG_LOCAL_MODELS__OPENVINO_DIR: /domino/datasets/local/<dataset>/openvino
    # The folder holding config_reranker.json and config_embedder.json (ovms):
    # RAG_OVMS_MODELS_DIR: /domino/datasets/local/<dataset>/ovms-models

# One block per App, keyed by workflow or by the name of a served component (a
# key that is neither is refused), for what really differs per App: kind (app | agent),
# environment_id, environment_revision_id (a revision of this App's environment,
# its own or the default one), hardware_tier_id, autoscaling {min_replicas
# (default 1), max_replicas, target_cpu_pct (1..100)} and settings (merged with
# the defaults' settings, this block's winning).
apps:
  # The orchestrator is published as a Domino Agent (configurationType AISYSTEM).
  # An Agent also gets RAG_DOMINO__TRACING=1 and RAG_BOOTSTRAP_EXTRAS=domino unless
  # its settings set them.
  workflow:
    kind: agent
    autoscaling: {min_replicas: 1, max_replicas: 2}
  # The model servers are plain Apps.
  embedder:
    kind: app
    # hardware_tier_id: <a tier with 8 cores>
  reranker:
    kind: app
    # hardware_tier_id: <a tier with 16 cores>
    # settings:
    #   RAG_LOCAL_MODELS__WORKERS: "2"  # torch runtime only; openvino runs one call at a time
