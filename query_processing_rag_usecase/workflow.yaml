# The RAG use case's workflow (ADR 0004, ADR 0005): its models, prompts, sizes
# and store, the one place they are pinned, since the toolkit defaults none of
# them. A command run from this directory reads this file; QP_WORKFLOW_FILE
# names another, such as a variant, instead. Each top-level key is a setting,
# and each value is overridden by the variable its path names, its levels
# joined by __, such as QP_GRAPH__STAGES__RERANK__TOP_K=5 or
# QP_COMPONENTS__RERANKER__BACKEND=fake. An API key is never written here:
# set it by its path, such as QP_COMPONENTS__LLM__API__API_KEY or
# QP_COMPONENTS__VECTOR_STORE__ELASTICSEARCH__API_KEY.
#
# What the components share is four more top-level blocks, left out here, so
# each takes its defaults (the README lists them): local_models (runtime:
# openvino | torch, openvino_dir, workers, cpus), calibration (budget_s,
# rounds), http (timeout_s, retries, backoff_s: the default of every
# component's own http block) and domino (token_url, token_ttl_s, tracing).
# For example QP_LOCAL_MODELS__RUNTIME=torch or QP_HTTP__RETRIES=0.
components:
  # Each component is of the type of its name (embedder, reranker, llm or
  # vector_store) unless `type` names it, and states its backend. A model's
  # source_id is its Hugging Face id or a folder; its alias, the name a model
  # server serves it under, is the last part of the source_id unless `alias`
  # says otherwise. The settings of one backend sit in a block named after it
  # (local, served, api): served is a model server of ours, api an endpoint we
  # do not run. How patiently a served or api component is called is its http
  # block: timeout_s, retries and backoff_s, each left out being the default
  # every component shares (the top-level http block). Nothing else decides a
  # backend: a component is moved behind a model server by setting its backend
  # and its URL, such as QP_COMPONENTS__RERANKER__BACKEND=served and
  # QP_COMPONENTS__RERANKER__SERVED__URL=http://localhost:8001/v3/rerank, which
  # qp-deploy writes for each component its topology alias serves.
  embedder:
    backend: local # local | served | api | fake
    source_id: Snowflake/snowflake-arctic-embed-l-v2.0
    query_prefix: "query: " # in front of every query, never of a passage
  reranker:
    backend: local # local | served | api | fake | none
    source_id: antoinelouis/crossencoder-camembert-base-mmarcoFR
  llm:
    backend: api # served | api | fake
    api:
      url: https://api.openai.com/v1/chat/completions
      api_format: openai
      model: gpt-4o-mini
    http:
      timeout_s: 120 # an answer takes longer than a model-server call
  vector_store:
    # elasticsearch | chroma | fake (in memory, seeded with the synthetic
    # corpus when it opens); one block per backend. Where the passages are
    # kept has no default: each store's block names it.
    backend: elasticsearch
    elasticsearch:
      url: http://localhost:9200 # http://user:password@host:9200 for basic auth
      index: rag_passages
    chroma: # QP_COMPONENTS__VECTOR_STORE__BACKEND=chroma
      collection: rag_passages

graph:
  # Each stage calls the component that `call` names, and states the workflow
  # state fields it reads and writes. It is an instance of the stage type
  # `type` names, else of the stage type of its name (retrieve, generate),
  # else a plain call: a key that names a request attribute fills it, reads
  # fill the other attributes in order, and writes take the answer's.
  stages:
    embed:
      call: embedder
      reads: [standalone_query]
      writes: [query_embedding]
    retrieve:
      call: vector_store
      # dense | lexical | hybrid; a lexical workflow has no embed stage
      retrieval_mode: dense
      top_k: 20 # candidates from the store
      # [query_embedding] for dense, [standalone_query] for lexical,
      # [query_embedding, standalone_query] for hybrid
      reads: [query_embedding]
      writes: [candidates]
    rerank:
      call: reranker
      top_k: 10 # passages kept and sent to the LLM
      reads: [standalone_query, candidates]
      writes: [reranked]
    generate:
      call: llm
      # what the user asked, then the passages; the answer
      reads: [conversational_query, reranked]
      writes: [answer]
      system_prompt: >-
        You answer questions using only the numbered context passages.
        Cite passages as [n]. If the context is insufficient, say so.
      # It holds {context} and {question}; any other brace is doubled.
      user_prompt: |-
        Context:
        {context}

        Question: {question}
  # Chains of plain edges, one edge per pair; START and END are reserved.
  edges:
    - [START, embed, retrieve, rerank]
    - [generate, END]
  # A registered edge condition, and where its true and false answers lead.
  conditional_edges:
    - source: rerank
      path: is_query_mode
      path_map: {true: generate, false: END}
