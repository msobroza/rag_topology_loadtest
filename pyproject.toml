[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-load-test"
version = "0.1.0"
description = "Locust load test comparing one RAG workflow (sentence-transformers + Elasticsearch or Chroma + reranker + OpenAI + LangGraph + FastAPI) across monolith and OpenVINO Model Server split topologies on Domino."
readme = "README.md"
requires-python = ">=3.11"  # the version in .python-version
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.40",  # imported directly (ASGI types, TestClient for --dry-run)
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-elasticsearch>=1.0",
    "elasticsearch[async]>=8.13",  # aiohttp node for AsyncElasticsearchStore
    # [openvino] is the default runtime of the in-process models
    # (RAG_LOCAL_MODEL_RUNTIME) and what rag-export-openvino needs. Its
    # optimum-intel accepts transformers < 5.6 only, so pip keeps transformers and
    # huggingface-hub at the versions it supports.
    "sentence-transformers[openvino]>=6.2",
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",  # config/prompts.yaml, read by pydantic-settings
    "joblib>=1.3",  # cpu_count() honours the container's CPU quota
    "threadpoolctl>=3.1",  # per-model caps on OpenMP/BLAS threads
]

[project.optional-dependencies]
# TEMPORARY, with the emulation (see emulation/README.md, "Removing the
# emulation"): what rag-domino-emulation needs beyond the project itself. Its
# proxy signs the identity token Domino passes to an App (RS256).
emulation = ["pyjwt>=2.8", "cryptography>=42"]
# RAG_VECTOR_STORE_BACKEND=chroma (embedded on disk, or a Chroma server).
chroma = ["chromadb>=1.0"]
# Driving the load test (locust monkey-patches gevent at import; keep it optional).
loadtest = ["locust>=2.29"]
# Domino 6.2 agent tracing (`domino.agents.tracing.add_tracing`).
domino = ["dominodatalab[agents]>=2.2.0"]
dev = [
    "locust>=2.29",
    "chromadb>=1.0",  # the Chroma store's tests run a real embedded Chroma
    # TEMPORARY, with the emulation: its tests sign tokens and parse Terraform.
    "pyjwt>=2.8",
    "cryptography>=42",
    "python-hcl2>=4.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Gate tools are pinned exactly: a new release may add a rule or move a score,
    # and `make check` must give the same verdict on the same commit everywhere.
    "ruff==0.17.4",
    "black==26.10.1",
    "pydoclint==0.12.0",
    "mypy==2.4.1",
    "ty==0.0.100",
    "complexipy==8.3.0",
    "vulture==2.16",
    "deptry==0.25.1",
]

[project.scripts]
rag-serve = "rag_load_test.entrypoints.workflow_api:main"
rag-ingest = "rag_load_test.entrypoints.ingest_cli:main"
rag-compare = "rag_load_test.loadtest.run_comparison:compare_main"
rag-model-server = "rag_load_test.entrypoints.model_server:main"
rag-served-models = "rag_load_test.entrypoints.served_models:main"
rag-export-openvino = "rag_load_test.entrypoints.export_openvino:main"
rag-fetch-corpus = "rag_load_test.entrypoints.fetch_corpus:main"
rag-deploy = "rag_load_test.deploy.cli:main"
rag-fake-domino = "fake_domino.server:main"
# TEMPORARY, with the emulation.
rag-domino-emulation = "fake_domino.emulation.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rag_load_test" = ["py.typed", "config/prompts.yaml"]
"fake_domino" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# tests/ mirrors src/rag_load_test, one folder per layer; what several test
# files share (named fakes, fixtures, REPO_ROOT) lives in tests/helpers, on the
# path so it is imported by plain module name. Test files keep unique names: the
# folders are not packages. tests/fake_domino/ shares its name with the package
# it tests; with src on the path the real package (it has an __init__.py) always
# wins over that folder.
pythonpath = ["src", "tests/helpers"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests/helpers"]

[tool.ruff.lint]
# Preview is on for DOC501 alone: explicit-preview-rules keeps every other
# preview rule off until it is named in `select`.
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "I", "W", "UP", "B",
    "D",  # docstrings, Google convention
    "DOC501",  # an exception a function raises is in its Raises section
    "ANN", "ARG", "C4", "SIM", "RET", "RUF", "PT", "N",
    "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
]
ignore = [
    "D105",  # magic methods need no docstring
    "D107",  # constructor arguments are documented on the class
    "ANN401",  # Any is allowed where a value really is anything
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 8
max-returns = 6
max-statements = 30

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "ARG", "PLR2004", "PLR0913", "E501"]
"src/rag_load_test/domain/corpus.py" = ["E501"]  # prose templates
# The fake Domino mirrors Domino's camelCase JSON field and query/path parameter
# names, so its models and route parameters cannot be snake_case.
"src/fake_domino/api_shapes.py" = ["N815"]
"src/fake_domino/apps_routes.py" = ["N803"]
"src/fake_domino/stand_ins.py" = ["N803"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
skip-checking-short-docstrings = false
# pydoclint only accepts a Raises entry for a `raise` in the function's own body,
# so an error raised through a helper could not be documented. ruff's DOC501
# checks the direction that matters: what the body raises is documented.
skip-checking-raises = true
allow-init-docstring = false

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
mypy_path = "src"
# BaseSettings fields fill from the env and YAML, so the plugin types __init__
# with every field optional (RagSettings() has required prompts).
plugins = ["pydantic.mypy"]

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 10  # cognitive complexity, per function
failed = true  # list only the functions over the limit

[tool.vulture]
paths = ["src", "tests", "locustfile.py", "vulture_whitelist.py"]
min_confidence = 60
# Functions a framework calls by registration, never by name in this code.
ignore_decorators = [
    "@*routes.get", "@*routes.post", "@*_router.get", "@*_router.post",  # FastAPI
    "@model_validator", "@field_validator",  # pydantic
    "@pytest.fixture",  # pytest, by parameter name
    "@task", "@events.*",  # Locust
]
ignore_names = [
    "model_config",  # pydantic reads it off every model class
    "pytest_plugins",  # pytest reads it off a test module
]

[tool.deptry]
known_first_party = ["rag_load_test", "fake_domino"]
optional_dependencies_dev_groups = ["dev"]
package_module_name_map = { dominodatalab = "domino" }

[tool.deptry.per_rule_ignores]
DEP002 = [
    "pyyaml",  # pydantic-settings' YAML source reads config/prompts.yaml with it
    "dominodatalab",  # imported by module name (domino.*) through importlib, see find_add_tracing
]
