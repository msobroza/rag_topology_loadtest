# Sitting of 14 November 2026, 17:01 to 17:40 UTC: the three topologies with FastAPI
# model servers on 8-vCPU machines. See README.md beside this file.

common:
  code: &code commit 4f729d9 on the Workspace and on every pool machine
  workspace: &workspace {machine_type: n2-standard-4, vcpus: 4}
  elasticsearch: &elasticsearch {machine_type: n2-standard-4, vcpus: 4}
  models: &models
    embedder: Snowflake/snowflake-arctic-embed-l-v2.0
    reranker: antoinelouis/crossencoder-camembert-base-mmarcoFR
    runtime: openvino
  thread_budget: &thread_budget
    # The thread_budget line every App logged at start.
    cpus: 8
    source: domino_hardware_tier
    runtime: openvino
    workers: 1
    embedder_threads: 8
    reranker_threads: 8
  deploy_defaults: &deploy_defaults
    # deploy.yaml as the Workspace's startup script wrote it at commit 4f729d9.
    environment_id: emulation-environment
    hardware_tier_id: cpu-8
    settings:
      RAG_ES_URL: the Elasticsearch machine (address not recorded here)
  workflow_defaults: &workflow_defaults
    RAG_TOP_K_RETRIEVE: "20 (the default)"
    RAG_TOP_K_RERANK: "5 (the default at commit 4f729d9)"
    RAG_HTTP_TIMEOUT_S: "30 (the default)"
  corpus: &corpus French corpus, 1,223 documents, 1,592 passages, French analyzer

experiments:
  - id: pr8-rerank
    question: How much does one FastAPI reranker on an 8-vCPU machine serve, alone?
    code: *code
    hardware:
      workspace: *workspace
      elasticsearch: *elasticsearch
      reranker: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
      embedder: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
      workflow: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
    models: *models
    thread_budget: *thread_budget
    deploy:
      topology: split-all
      model_server: fastapi
      defaults: *deploy_defaults
      apps: {}
    load:
      target: the reranker's machine, port 8888, without the emulated Domino's proxy
      route: POST /v3/rerank
      command: make loadtest-models TARGET=rerank
      users: [20]
      duration: 2m
      spawn_rate: 5
      passages: the load test's 20 synthetic passages per request
    runs: [pr8-rerank-u20]
    notes:
      - deploy.yaml had no topology key, so rag-deploy used its defaults, split-all and fastapi.
      - The reranker App log counted no "Infer Request is busy" line before or after the run.

  - id: pr8-embed
    question: How much does one FastAPI embedder on an 8-vCPU machine serve, alone?
    code: *code
    hardware:
      workspace: *workspace
      elasticsearch: *elasticsearch
      reranker: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
      embedder: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
      workflow: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
    models: *models
    thread_budget: *thread_budget
    deploy:
      topology: split-all
      model_server: fastapi
      defaults: *deploy_defaults
      apps: {}
    load:
      target: the embedder's machine, port 8888, without the emulated Domino's proxy
      route: POST /v3/embeddings
      command: make loadtest-models TARGET=embeddings
      users: [20]
      duration: 2m
      spawn_rate: 5
      passages: one question per request
    runs: [pr8-embed-u20]
    notes:
      - Ran while rag-ingest was still embedding the corpus on the Workspace, where Locust runs.

  - id: pr8-split-all
    question: How does split-all serve /retrieve as the users grow?
    code: *code
    hardware:
      workspace: *workspace
      elasticsearch: *elasticsearch
      workflow: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
      embedder: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
      reranker: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
    models: *models
    thread_budget: *thread_budget
    deploy:
      topology: split-all
      model_server: fastapi
      defaults: *deploy_defaults
      apps: {}
      workflow_settings: *workflow_defaults
    run_label: split-all-fastapi
    load:
      target: the workflow App through the emulated Domino's proxy
      route: POST /retrieve only (RAG_LOADTEST_QUERY_WEIGHT=0)
      command: make -C emulation loadtest
      users: [5, 10, 15, 20]
      duration: 2m
      spawn_rate: 5
      passages: the corpus's, 20 candidates from the index per request
      corpus: *corpus
    runs: [pr8-split-all-u5, pr8-split-all-u10, pr8-split-all-u15, pr8-split-all-u20]
    notes:
      - The runs went in the order u20, u5, u10, u15, from 17:21 to 17:29 UTC.
      - The u5 run is distorted by reranks left over from the u20 run before it. Measured
        clean that evening (see 2026-11-14-cache-bucket-cold-and-warm-sittings), 5 users gave
        87 requests, 0.73 requests a second, p50 6.2 s.
      - No App log counted an "Infer Request is busy" line. The workflow App logged 355 MLflow
        tracing warnings over the sitting; they do not change the figures.

  - id: pr8-monolith
    question: How does monolith serve /retrieve at 10 users on the same machines?
    code: *code
    hardware:
      workspace: *workspace
      elasticsearch: *elasticsearch
      workflow: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
    models: *models
    thread_budget: *thread_budget
    deploy:
      topology: monolith
      model_server: fastapi
      defaults: *deploy_defaults
      apps: {}
      workflow_settings: *workflow_defaults
      how_the_topology_was_set: unknown (an edit of deploy.yaml or RAG_DEPLOY_TOPOLOGY)
    run_label: monolith
    load:
      target: the workflow App through the emulated Domino's proxy
      route: POST /retrieve only (RAG_LOADTEST_QUERY_WEIGHT=0)
      command: make -C emulation loadtest
      users: [10]
      duration: 2m
      spawn_rate: 5
      passages: the corpus's, 20 candidates from the index per request
      corpus: *corpus
    runs: [pr8-monolith-u10]
    notes:
      - The embedder and the reranker run in the workflow's process, one model call at a time.

  - id: pr8-split-reranker
    question: How does split-reranker serve /retrieve at 10 users on the same machines?
    code: *code
    hardware:
      workspace: *workspace
      elasticsearch: *elasticsearch
      workflow: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
      reranker: {machine_type: n2-standard-8, vcpus: 8, replicas: 1, hardware_tier: cpu-8}
    models: *models
    thread_budget: *thread_budget
    deploy:
      topology: split-reranker
      model_server: fastapi
      defaults: *deploy_defaults
      apps: {}
      workflow_settings: *workflow_defaults
      how_the_topology_was_set: unknown (an edit of deploy.yaml or RAG_DEPLOY_TOPOLOGY)
    run_label: split-reranker-fastapi
    load:
      target: the workflow App through the emulated Domino's proxy
      route: POST /retrieve only (RAG_LOADTEST_QUERY_WEIGHT=0)
      command: make -C emulation loadtest
      users: [10]
      duration: 2m
      spawn_rate: 5
      passages: the corpus's, 20 candidates from the index per request
      corpus: *corpus
    runs: [pr8-split-reranker-u10]
